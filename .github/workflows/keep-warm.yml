# Keeps the Render free-tier API awake (it sleeps after 15 min idle).
# Only the API: Render's 750 free instance-hours/month cover one always-on service, not two.
# GitHub may run scheduled jobs a few minutes late; every 10 min leaves room for that.
name: Keep API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 60 https://steppool-api.onrender.com/health) && echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "API did not answer 200"; exit 1
