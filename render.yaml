# Render Blueprint — free plan: one web service (API + Socket.IO + lifecycle jobs in-process)
# and a free Key Value (Redis). MongoDB is Atlas: set MONGO_URL as a secret.
#
# To move to paid: set plan: starter, set JOBS_IN_PROCESS=false, and add a worker service:
#   - type: worker, rootDir: server, buildCommand: npm ci && npm run build, startCommand: npm run worker
services:
  - type: web
    name: steppool-api
    runtime: node
    rootDir: server
    plan: free
    region: frankfurt # closest Render region to Accra
    # --include=dev: NODE_ENV=production would otherwise skip the bundler (esbuild).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JOBS_IN_PROCESS
        value: "true"
      - key: PUBLIC_URL
        value: https://steppool-api.onrender.com
      - key: MONGO_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAID_ENTRY_TESTERS
        sync: false
      - key: SPONSOR_FEE_PCT
        value: "15"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: StepPool <onboarding@resend.dev>
      - key: MAIL_USER
        sync: false
      - key: MAIL_APP_PASSWORD
        sync: false
      - key: APPLE_AUDIENCES
        value: com.steppool.app
      - key: ADMIN_EMAILS
        value: leslieajayi27@gmail.com
      - key: GOOGLE_CLIENT_IDS
        value: 1009173626527-5kg1gke7bt4j5c8165vv9jalht16r0fl.apps.googleusercontent.com,1009173626527-q7f0snkntnvu2ag4u4t6gb4t7jfairo9.apps.googleusercontent.com
      - key: APPLE_TEAM_ID
        sync: false
      - key: ANDROID_SHA256_FINGERPRINTS
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: steppool-redis
          property: connectionString

  # Web: marketing site + admin console (Next.js). Talks to the API from the browser.
  # Static export (web/next.config.ts): never sleeps and uses none of the free plan's 750 instance hours.
  - type: web
    name: steppool-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: https://steppool-api.onrender.com
  - type: keyvalue
    name: steppool-redis
    plan: free
    region: frankfurt
    # BullMQ requires keys never be evicted.
    maxmemoryPolicy: noeviction
    ipAllowList: []
