# Render Blueprint — free plan: one web service (API + Socket.IO + lifecycle jobs in-process)
# and a free Key Value (Redis). MongoDB is Atlas: set MONGO_URL as a secret.
#
# To move to paid: set plan: starter, set JOBS_IN_PROCESS=false, and add a worker service:
#   - type: worker, rootDir: server, buildCommand: npm ci && npm run build, startCommand: npm run worker
services:
  - type: web
    name: steppool-api
    runtime: node
    rootDir: server
    plan: free
    region: frankfurt # closest Render region to Accra
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JOBS_IN_PROCESS
        value: "true"
      - key: PUBLIC_URL
        value: https://steppool-api.onrender.com
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: MAIL_USER
        sync: false
      - key: MAIL_APP_PASSWORD
        sync: false
      - key: APPLE_AUDIENCES
        value: com.steppool.app
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: ANDROID_SHA256_FINGERPRINTS
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: steppool-redis
          property: connectionString

  - type: keyvalue
    name: steppool-redis
    plan: free
    region: frankfurt
    # BullMQ requires keys never be evicted.
    maxmemoryPolicy: noeviction
    ipAllowList: []
