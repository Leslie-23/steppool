# StepPool API on the shared Oracle VM. Lives in ~/steppool, separate from other projects.
# The shared Caddy in ~/proxy reaches it over the external "proxy" network (see steppool.caddy).
# Deploy with server/deploy/deploy.sh; secrets live in ~/steppool/.env on the server.
name: steppool
services:
  api:
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
    container_name: steppool-api
    restart: unless-stopped
    env_file: ../../.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      JOBS_IN_PROCESS: "true"
      REDIS_URL: redis://redis:6379
      OSRM_FOOT_URL: http://osrm:5000
    depends_on: [redis]
    networks: [default, proxy]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: steppool-redis
    restart: unless-stopped
    # AOF so BullMQ jobs survive restarts; BullMQ requires keys never be evicted.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data

  # Walking routes for directions, loop suggestions and route snapping. Reads the Ghana footpath data the
  # Trofficient project builds (deploy/oracle/osrm/prepare.sh foot) read-only, in its own container so
  # neither project depends on the other being up. Rebuild that data, then: docker restart steppool-osrm
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: steppool-osrm
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "--max-matching-size", "100", "/data/ghana-latest.osrm"]
    mem_limit: 1g
    volumes:
      - /home/ubuntu/trofficient/deploy/oracle/osrm/data-foot:/data:ro

networks:
  proxy:
    external: true

volumes:
  redis_data:
